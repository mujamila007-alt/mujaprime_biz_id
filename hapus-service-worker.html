<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Perbaiki Refresh MujaPrime</title>
  <style>body{font-family:Arial,sans-serif;background:#0b0b12;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;padding:24px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}</style>

    <!-- MUJA PRIME Professional Responsive Upgrade -->
    <link rel="stylesheet" href="/professional.css?v=20260907-pro-v1">
    <script src="/professional-ui.js?v=20260907-pro-v1" defer></script>
</head>
<body>
  <div class="box">
    <h1>Perbaiki Refresh MujaPrime</h1>
    <p>Tekan tombol ini sekali jika browser masih menyimpan service worker lama dan halaman terasa refresh berulang.</p>
    <button onclick="fix()">Bersihkan Sekarang</button>
    <p id="status"></p>
  </div>
  <script>
    async function fix(){
      const s=document.getElementById('status');
      s.textContent='Membersihkan...';
      try{
        if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
        if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
        try{ localStorage.removeItem('muja_build_seen'); sessionStorage.clear(); }catch(e){}
        s.textContent='Selesai. Kembali ke beranda...';
        setTimeout(()=>location.replace('/'),800);
      }catch(e){ s.textContent='Gagal membersihkan otomatis. Coba clear data browser.'; }
    }
  </script>
</body>
</html>
