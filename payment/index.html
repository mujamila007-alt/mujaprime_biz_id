    <style>
        .payment-container {
            max-width: 500px;
            margin: 20px auto;
        }
        
        .payment-card {
            background: var(--surface-1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-card);
        }
        
        .payment-header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .payment-header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--ember-400), var(--gold-400));
            -webkit-background-clip: text;
                color: black;
        }
        
        .product-info {
            background: var(--surface-2);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
        }
        
        .product-info-row {
                margin: 6px;
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .product-info-row:last-child {
            border-bottom: none;
        }
        
        .payment-detail {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: var(--surface-2);
            border-radius: var(--radius-md);
        }
        
        .payment-number {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--ember-400), var(--gold-400));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin: 10px 0;
        }
        
        .qris-image {
            max-width: 250px;
            margin: 0 auto;
            display: block;
            border-radius: 16px;
        }
        
        .countdown {
            text-align: center;
            margin: 20px 0;
        }
        
        .countdown-timer {
            font-size: 48px;
            font-weight: 800;
            color: var(--ember-500);
            
        }
        
        .upload-section {
            margin: 20px 0;
            padding: 20px;
           background: #ffffff33;
    border-radius: 33px;
            border: 2px dashed var(--border-medium);
            text-align: center;
        }
        
        .upload-section.has-image {
            padding: 12px;
        }
        
        .upload-section.has-image .upload-label {
            display: none;
        }
        
        .upload-section .preview-container {
            text-align: center;
        }
        
        .upload-section .preview-container .preview-image {
            max-width: 150px;
            margin: 0 auto 12px;
            display: block;
            border-radius: var(--radius-sm);
        }
        
        .upload-section .preview-container .remove-image {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            display: inline-block;
        }
        
        .upload-section .preview-container .remove-image:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        .upload-label {
          display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: 2px dashed #ffffff;
    border-radius: 17px;
    cursor: pointer;
    font-weight: 600;
    transition: var(--transition);
    color: var(--text-secondary);
        }
        
        .upload-label:hover {
            transform: translateY(-2px);
            border-color: var(--ember-400);
            color: var(--ember-400);
        }
        
        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #b7b7b74f, #0000000d);
            color: var(--brand-900);
            border: 2px solid #babababf;;
            border-radius: 22px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 16px;
        }
        
        .btn-verify:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-verify.loading {
            opacity: 0.7;
            cursor: wait;
        }
        
        .warning-text {
            color: #ef4444;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .toast-notif {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-3);
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 12px;
            z-index: 9999;
            white-space: nowrap;
        }
        
        @media (max-width: 480px) {
            .payment-card {
                padding: 16px;
            }
            .payment-number {
                font-size: 20px;
            }
            .countdown-timer {
                font-size: 36px;
            }
        }
    </style>
