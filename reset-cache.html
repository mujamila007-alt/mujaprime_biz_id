<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
    <!-- MUJA CACHE FIX AMAN: bersihkan cache tanpa auto-refresh berulang -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
    (function() {
        var MUJA_BUILD = '20260603-theme-persist-v4';
        window.MUJA_BUILD = MUJA_BUILD;

        // Bersihkan Cache Storage lama tanpa memaksa halaman reload.
        if ('caches' in window) {
            caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(key) { return caches.delete(key); }));
            }).catch(function(){});
        }

        // Kirim pesan clear cache ke service worker lama, tanpa memaksa reload halaman.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(reg) {
                    if (reg.active) {
                        try { reg.active.postMessage({ type: 'MUJA_CLEAR_CACHE', build: MUJA_BUILD }); } catch(e) {}
                    }
                });
            }).catch(function(){});
        }
    })();
    </script>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reset Cache Muja Prime</title>
  <style>body{font-family:Arial,sans-serif;background:#080810;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;padding:24px;border:1px solid rgba(255,255,255,.15);border-radius:20px;background:rgba(255,255,255,.06);text-align:center}a{color:#f5c842}</style>

    <!-- MUJA PRIME Professional Responsive Upgrade -->
    <link rel="stylesheet" href="/professional.css?v=20260907-pro-v1">
    <script src="/professional-ui.js?v=20260907-pro-v1" defer></script>
</head>
<body>
  <div class="box">
    <h1>Membersihkan cache...</h1>
    <p>Halaman akan diarahkan ke versi terbaru.</p>
    <p><a href="/">Klik di sini jika tidak otomatis.</a></p>
  </div>
  <script>
  (async function(){
    try{ if('caches' in window){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); } }catch(e){}
    try{ if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); } }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    location.replace('/');
  })();
  </script>
</body>
</html>
